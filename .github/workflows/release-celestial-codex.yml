name: Celestial Codex - versioned GitHub Release

# A release is created only when the module manifest is bumped on main.
# Mod artifacts require a separate Windows/SCNET build and Android validation.
on:
  push:
    branches:
      - main
    paths:
      - 'src/CelestialCodex/modinfo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celestial-codex-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate the module version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          meta = json.loads(Path("src/CelestialCodex/modinfo.json").read_text(encoding="utf-8"))
          if meta.get("PackageName") != "CelestialCodex":
              raise SystemExit("Invalid module identity")
          version = meta.get("Version", "")
          if not isinstance(version, str) or not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version):
              raise SystemExit("Invalid version; expected X.Y.Z")
          tag = "celestial-codex-v" + version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("version=" + version + "\n")
              f.write("tag=" + tag + "\n")
          PY

      - name: Check for an existing Release and tag conflict
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; preserving published history."
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            existing_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG exists at $existing_sha, not $GITHUB_SHA. Refusing to move an existing version." >&2
              exit 1
            fi
          fi

      - name: Publish source-only prerelease
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/celestial-release-notes.md" <<EOF
          ## 云天书典 $RELEASE_VERSION

          此版本由 `src/CelestialCodex/modinfo.json` 版本变更自动建立。

          - **交付状态：源码预发布（Source-only prerelease）**
          - **目标环境：** Survivalcraft 2.4 / SCNET Net_x25.01.17 / Android
          - **源码：**使用该 Release 自动提供的 Source code (zip/tar.gz) 下载
          - **安装包：**尚未附加经编译核验的 `.netmod`；不能将源码归档当作游戏安装包
          - **测试状态：**需要查看对应版本的仓库测试记录和 Android 真机结果

          提交：`$GITHUB_SHA`

          在本机 Windows 使用受许可的 SCNET 游戏程序集完成 Release 构建与测试后，再把对应版本的 `.netmod` 作为 Release asset 上传；只有实际验证通过后，才能把预发布转为正式 Release。
          EOF
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "云天书典 $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/celestial-release-notes.md" \
            --prerelease \
            --latest=false
